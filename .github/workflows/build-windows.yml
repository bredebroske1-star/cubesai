name: Build Windows Installer

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: lazycat
        run: npm install

      - name: Build Windows installer
        working-directory: lazycat
        run: npm run package-win

      - name: Debug: list dist_electron
        working-directory: lazycat
        run: |
          echo "Contents of lazycat/dist_electron:" 
          dir dist_electron || ls -la dist_electron || true
          echo "Files in lazycat:" 
          dir || ls -la || true

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
            token: ${{ secrets.GITHUB_TOKEN }}
            tag_name: "windows-build-${{ github.run_id }}"
            release_name: "Windows build ${{ github.run_id }}"
            draft: false
            prerelease: false

        - name: Find installer
          id: find_installer
          run: |
            pwsh -c "$exe = Get-ChildItem -Path lazycat/dist_electron -Filter *.exe | Select-Object -First 1; echo "installer=$($exe.FullName)" >> $env:GITHUB_OUTPUT"

      - name: Upload installer
        uses: actions/upload-release-asset@v1
        with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: ${{ steps.find_installer.outputs.installer }}
            asset_name: LazyCat-Installer.exe
            asset_content_type: application/octet-stream
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact (installer)
        uses: actions/upload-artifact@v3
        with:
          name: LazyCat-Installer
          path: ${{ steps.find_installer.outputs.installer }}
