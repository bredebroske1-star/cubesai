name: Build, Publish Docker image and Optional SSH Deploy

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/archai:latest

  ssh-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: secrets.SSH_PRIVATE_KEY != ''
    steps:
      - name: Install ssh client
        run: sudo apt-get update && sudo apt-get install -y openssh-client

      - name: Copy SSH key
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: SSH: Pull image and restart container
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/archai:latest
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            docker pull $IMAGE || true && \
            docker rm -f archai || true && \
            docker run -d --name archai -p 8000:8000 --restart=unless-stopped $IMAGE
          "

  deploy-fly:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: secrets.FLY_API_TOKEN != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions@v1
        with:
          args: "install"

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config ./fly.toml --image ghcr.io/${{ github.repository_owner }}/archai:latest --remote-only
