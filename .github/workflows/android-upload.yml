name: Build & Upload Android AAB
on:
  workflow_dispatch:

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build web
        run: |
          cd lazycat
          npm install
          npm run build-web

      - name: Copy web assets to Android (Capacitor)
        run: |
          cd lazycat
          npx cap copy android || true

      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "Restoring keystore from secret"
          mkdir -p lazycat
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > lazycat/lazycat.keystore

      - name: Ensure gradlew executable
        working-directory: lazycat/android
        run: chmod +x gradlew || true

      - name: Build signed AAB
        working-directory: lazycat/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../lazycat.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload to Play Store (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.example.lazycat
          releaseFiles: lazycat/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
