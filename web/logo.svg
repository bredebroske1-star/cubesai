<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
  <title>LazyCat logo</title>
  <defs>
    <linearGradient id="body" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#f2d6c9" />
      <stop offset="100%" stop-color="#e0b7a2" />
    </linearGradient>
  </defs>
  <!-- sleeping cat body -->
  <g transform="translate(8,8)">
    <ellipse cx="36" cy="32" rx="28" ry="18" fill="url(#body)" stroke="#c89f8b" stroke-width="1" />
    <circle cx="18" cy="24" r="6" fill="#f2d6c9" stroke="#c89f8b" stroke-width="1" />
    <path d="M8 18 Q12 10 18 12" fill="#f2d6c9" stroke="#c89f8b" stroke-width="1"/>
    <!-- closed eye lines -->
    <path d="M26 28 Q30 30 34 28" stroke="#8b6b59" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M10 28 Q14 30 18 28" stroke="#8b6b59" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Zs -->
    <text x="60" y="18" font-family="sans-serif" font-size="12" fill="#8b6b59">Z z</text>
  </g>
  <!-- text -->
  <text x="84" y="40" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="20" fill="#222">LazyCat</text>
  <text x="84" y="58" font-family="Inter, Arial, sans-serif" font-size="10" fill="#666">Browser — privacy focused, open source</text>
</svg>
